openapi: 3.0.3
info:
  title: Spring Up - Gamified Alarm & Telemetry Engine
  description: >
    Enterprise REST API contract for Spring Up. Coordinates alarm scheduling, 
    multi-mission gauntlets, wake-up check timers, and streak telemetry.
  version: 1.1.0
servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  /api/v1/alarms:
    get:
      summary: Retrieve all alarms
      operationId: getAllAlarms
      responses:
        '200':
          description: List of alarms retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlarmResponseDto'
    post:
      summary: Create a new alarm
      operationId: createAlarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmRequestDto'
      responses:
        '201':
          description: Alarm successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/alarms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get alarm by ID
      operationId: getAlarmById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmResponseDto'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Update existing alarm
      operationId: updateAlarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmRequestDto'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete an alarm
      operationId: deleteAlarm
      responses:
        '204':
          description: Alarm deleted successfully
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/alarms/{id}/toggle:
    patch:
      summary: Toggle alarm enabled state
      operationId: toggleAlarm
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: enabled
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmResponseDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/minigames/challenge:
    get:
      summary: Fetch dynamic challenge for an alarm mission
      operationId: getChallenge
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MinigameType'
        - name: difficulty
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'

  /api/v1/minigames/verify:
    post:
      summary: Verify minigame solution and dismiss alarm
      operationId: verifySolution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '422':
          description: Solution incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  schemas:
    MinigameType:
      type: string
      enum: [NONE, MATH, POWER_SHAKE, BARCODE_SCAN, GRID_MEMORY]

    MissionConfigDto:
      type: object
      required:
        - stepOrder
        - minigame
        - difficulty
        - requiredCompletions
      properties:
        stepOrder:
          type: integer
          example: 1
        minigame:
          $ref: '#/components/schemas/MinigameType'
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
          example: 2
        requiredCompletions:
          type: integer
          minimum: 1
          maximum: 100
          example: 3
        targetBarcodeHash:
          type: string
          nullable: true
          example: "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3"

    AlarmRequestDto:
      type: object
      required:
        - title
        - alarmTime
        - missions
      properties:
        title:
          type: string
          example: "Arcade Morning Gauntlet"
        alarmTime:
          type: string
          example: "06:30:00"
        isEnabled:
          type: boolean
          default: true
        repeatDaysMask:
          type: integer
          minimum: 0
          maximum: 127
          example: 31
        wakeUpCheckEnabled:
          type: boolean
          default: true
        wakeUpCheckDelayMinutes:
          type: integer
          minimum: 1
          maximum: 60
          default: 5
        missions:
          type: array
          items:
            $ref: '#/components/schemas/MissionConfigDto'
        vibrate:
          type: boolean
          default: true
        volumeLevel:
          type: integer
          minimum: 0
          maximum: 100
          default: 100

    AlarmResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Arcade Morning Gauntlet"
        alarmTime:
          type: string
          example: "06:30:00"
        isEnabled:
          type: boolean
        repeatDaysMask:
          type: integer
        wakeUpCheckEnabled:
          type: boolean
        wakeUpCheckDelayMinutes:
          type: integer
        missions:
          type: array
          items:
            $ref: '#/components/schemas/MissionConfigDto'
        vibrate:
          type: boolean
        volumeLevel:
          type: integer

    ChallengeResponse:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MinigameType'
        difficulty:
          type: integer
        challengePayload:
          type: string
        memorySequence:
          type: array
          items:
            type: integer
          nullable: true

    VerificationRequest:
      type: object
      required:
        - alarmId
        - minigameType
      properties:
        alarmId:
          type: integer
          format: int64
        minigameType:
          $ref: '#/components/schemas/MinigameType'
        submittedSolution:
          type: string
          nullable: true
        submittedSequence:
          type: array
          items:
            type: integer
          nullable: true
        secondsTaken:
          type: integer
        snoozeCount:
          type: integer

    VerificationResponse:
      type: object
      properties:
        isDismissed:
          type: boolean
        currentStreak:
          type: integer
        message:
          type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        timestamp:
          type: string
          format: date-time
        invalidFields:
          type: object
          additionalProperties:
            type: string

  responses:
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'